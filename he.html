<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Totally Serious Warning</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
  }

  .msg {
    position: absolute;
    font-size: 28px;
    font-weight: bold;
    color: lime;
    user-select: none;
  }

  #stop {
    position: fixed;
    z-index: 9999;
    top: 20px;
    left: 20px;
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
    background: white;
    color: black;
    border: none;
    border-radius: 8px;
  }

  #title {
    position: fixed;
    z-index: 9998;
    width: 100%;
    text-align: center;
    top: 45%;
    font-size: 40px;
    color: red;
  }
</style>
</head>

<body>

<div id="title">⚠ SYSTEM ERROR: YOU ARE AN IDIOT ⚠</div>
<button id="stop">Stop prank</button>

<script>
let running = true;
let messages = [];

function createMessage() {
  if (!running) return;

  let el = document.createElement("div");
  el.className = "msg";
  el.textContent = "You're an idiot!";

  el.x = Math.random() * (window.innerWidth - 200);
  el.y = Math.random() * (window.innerHeight - 50);
  el.dx = (Math.random() * 4) + 1;
  el.dy = (Math.random() * 4) + 1;

  el.style.left = el.x + "px";
  el.style.top = el.y + "px";

  document.body.appendChild(el);
  messages.push(el);

  if (messages.length < 40) {
    setTimeout(createMessage, 200);
  }
}

function animate() {
  if (!running) return;

  for (let el of messages) {
    el.x += el.dx;
    el.y += el.dy;

    if (el.x < 0 || el.x > window.innerWidth - 200) el.dx *= -1;
    if (el.y < 0 || el.y > window.innerHeight - 50) el.dy *= -1;

    el.style.left = el.x + "px";
    el.style.top = el.y + "px";
  }

  requestAnimationFrame(animate);
}

document.getElementById("stop").onclick = () => {
  running = false;
  document.body.innerHTML =
    "<h1 style='text-align:center;margin-top:40vh;font-family:Arial'>😂 Gotcha! It was just a prank.</h1>";
};

createMessage();
animate();
</script>

</body>
</html>
